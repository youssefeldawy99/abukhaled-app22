                const container = document.currentScript.parentElement;
                
                menuItems.forEach((item, index) => {
                    const cardHTML = `
                        <div class="menu-item bg-white rounded-2xl shadow-sm border border-gray-100 p-3 mb-2" data-category="${item.cat}">

                                    <h3 class="font-bold text-gray-800 text-sm mb-1">${item.name}</h3>
                                    <p class="text-xs text-gray-400">سعر الصنف: ${item.price} ج.م</p>
                                </div>
                            </div>
                            
                            <div class="mt-3 bg-gray-50 rounded-xl p-3 border border-gray-100">
                                <div class="flex justify-between items-center mb-2">
                                    <span class="text-xs font-bold text-gray-700"><i class="fa-solid fa-calculator text-ak-gold ml-1"></i> حدد الكمية:</span>
                                    <div class="flex items-center gap-3 bg-white border border-gray-200 rounded-lg p-1">
                                        <button onclick="updateQty('qty-${index}', -1, ${item.price}, 'total-${index}')" class="w-6 h-6 flex items-center justify-center text-red-500 font-bold hover:bg-gray-100 rounded">-</button>

                                </div>

                <div>
                    <h4 class="font-bold text-sm text-gray-800"><i class="fa-solid fa-location-dot text-ak-gold ml-1"></i> فرع الحصري</h4>
                    <p class="text-gray-500 text-[10px] mt-1">مركز هنيدة بجوار جامعة 6 اكتوبر</p>
                </div>
                <a href="https://maps.google.com" target="_blank" class="bg-gray-800 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow hover:bg-black transition flex items-center gap-1">
                    <i class="fa-solid fa-location-arrow"></i> خريطة
                </a>
            </div>

                    <h4 class="font-bold text-sm text-gray-800"><i class="fa-solid fa-location-dot text-ak-gold ml-1"></i> فرع الحي الخامس</h4>

                <a href="https://www.instagram.com/abu_khaled_restaurant" target="_blank" class="w-10 h-10 rounded-full bg-pink-600 text-white flex items-center justify-center text-lg shadow hover:scale-110"><i class="fa-brands fa-instagram"></i></a>

    <!-- البرمجة -->
    <script>
        const whatsappNumber = "201222200506"; 

        function filterCategory(category, button) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-ak-gold', 'text-white', 'border-ak-gold');
                btn.classList.add('bg-white', 'text-gray-700', 'border-gray-200');
            });
            button.classList.remove('bg-white', 'text-gray-700', 'border-gray-200');
            button.classList.add('bg-ak-gold', 'text-white', 'border-ak-gold');

            let items = document.querySelectorAll('.menu-item');
            items.forEach(item => {
                if (category === 'all' || item.getAttribute('data-category') === category) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function updateQty(qtyId, change, price, totalId) {
            let input = document.getElementById(qtyId);
            let totalEl = document.getElementById(totalId);
            
            let currentQty = parseInt(input.innerText);
            let newQty = currentQty + change;
            
            if (newQty >= 1) {
                input.innerText = newQty;
                totalEl.innerText = (newQty * price) + " ج.م";
            }
        }

        function sendOrder(itemName, qtyId, price) {
            let qty = parseInt(document.getElementById(qtyId).innerText);
            let total = qty * price;
            
            // رسالة واتساب شيك زي ما طلبت
            let message = `مرحباً، أريد طلب:\n\nالصنف: ${itemName}\nالكمية: ${qty}\nالإجمالي: *${total} ج.م*\n\nبرجاء التأكيد وإبلاغي بخطوات التوصيل.`;
            
            let encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${whatsappNumber}?text=${encodedMessage}`, '_blank');
        }
    </script>
