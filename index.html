<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو خالد للمشويات</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { 'ak-black': '#121212', 'ak-gold': '#d4af37', 'ak-gray': '#1e1e1e' } }
            }
        }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #000; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .added-to-cart { background-color: #22c55e !important; color: white !important; transition: all 0.3s ease; }
    </style>
</head>
<body class="flex justify-center items-start min-h-screen">

    <div class="w-full max-w-md bg-ak-black text-white min-h-screen relative shadow-2xl pb-24 border-x border-white/10">

        <!-- الهيدر -->
        <header class="flex justify-between items-center p-4 bg-ak-black border-b border-ak-gold/20 sticky top-0 z-40">
            <div class="text-xl font-bold text-ak-gold flex items-center gap-2">
                <i class="fa-solid fa-fire-burner"></i> أبو خالد
            </div>
            <!-- زرار الاتصال المباشر (هنربطه برقم التليفون) -->
            <a href="tel:15000" class="bg-ak-gold text-ak-black px-4 py-1.5 rounded-full font-bold text-sm shadow-md">
                اتصل بفرعك
            </a>
        </header>

        <!-- شريط الأقسام (Scroll) -->
        <nav class="flex overflow-x-auto hide-scrollbar gap-3 p-4 whitespace-nowrap">
            <button class="bg-ak-gold text-ak-black px-6 py-2 rounded-full font-bold text-sm shadow-lg">عروض العائلة</button>
            <button class="bg-ak-gray text-white px-6 py-2 rounded-full font-medium text-sm border border-ak-gold/30">المشويات</button>
            <button class="bg-ak-gray text-white px-6 py-2 rounded-full font-medium text-sm border border-ak-gold/30">الطواجن</button>
        </nav>

        <!-- المنيو -->
        <main class="p-4 grid grid-cols-1 gap-5">
            
            <!-- كارت 1 -->
            <div class="bg-ak-gray rounded-2xl overflow-hidden border border-white/5 shadow-lg relative">
                <span class="absolute top-3 right-3 bg-red-600 text-white text-xs font-bold px-2 py-1 rounded-md z-10">خصم خاص</span>
                <img src="https://images.unsplash.com/photo-1555939594-58d7cb561ad1?q=80&w=600&auto=format&fit=crop" alt="صينية عائلية" class="w-full h-48 object-cover opacity-90">
                <div class="p-4">
                    <h2 class="text-lg font-bold text-ak-gold mb-1">صينية لمة العيلة (6 أفراد)</h2>
                    <p class="text-gray-400 text-sm mb-3">نصف بطة، فرخة شيش، كفتة، ممبار، نيفة وحمام مع أرز بسمتي.</p>
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-2xl font-bold text-white">3222</span>
                            <span class="text-xs text-gray-400">ج.م</span>
                        </div>
                        <button onclick="addToCart('صينية لمة العيلة', 3222, this)" class="bg-ak-gold text-ak-black px-5 py-2 rounded-xl font-bold text-sm flex items-center gap-2">
                            <i class="fa-solid fa-cart-shopping"></i> <span>أضف</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- كارت 2 -->
            <div class="bg-ak-gray rounded-2xl overflow-hidden border border-white/5 shadow-lg">
                <img src="https://images.unsplash.com/photo-1529193591184-b1d58069ecdd?q=80&w=600&auto=format&fit=crop" alt="مشكل ضاني" class="w-full h-48 object-cover opacity-90">
                <div class="p-4">
                    <h2 class="text-lg font-bold text-ak-gold mb-1">ربع كيلو مشكل ضاني</h2>
                    <p class="text-gray-400 text-sm mb-3">ربع كيلو مشكل (كفتة وكباب ضاني) على الفحم مع السلطات.</p>
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="text-2xl font-bold text-white">269</span>
                            <span class="text-xs text-gray-400">ج.م</span>
                        </div>
                        <button onclick="addToCart('ربع كيلو مشكل ضاني', 269, this)" class="bg-ak-gold text-ak-black px-5 py-2 rounded-xl font-bold text-sm flex items-center gap-2">
                            <i class="fa-solid fa-cart-shopping"></i> <span>أضف</span>
                        </button>
                    </div>
                </div>
            </div>

        </main>

        <!-- شريط التنقل السفلي الثابت -->
        <nav class="absolute bottom-0 w-full max-w-md bg-ak-black/95 backdrop-blur-md border-t border-ak-gold/20 flex justify-around items-center p-3 z-50 rounded-t-2xl pb-5">
            <a href="#" class="flex flex-col items-center text-ak-gold">
                <i class="fa-solid fa-house mb-1 text-xl"></i>
                <span class="text-[11px] font-bold mt-1">الرئيسية</span>
            </a>
            <!-- زرار طلباتي (لما يدوس عليه يبعت الواتساب) -->
            <button onclick="sendOrderWhatsApp()" class="flex flex-col items-center text-gray-500 hover:text-ak-gold transition relative">
                <span id="cart-count" class="absolute -top-2 -right-2 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
                <i class="fa-solid fa-cart-shopping mb-1 text-xl"></i>
                <span class="text-[11px] font-bold mt-1">طلباتي</span>
            </button>
            <a href="#" class="flex flex-col items-center text-gray-500 hover:text-ak-gold transition">
                <i class="fa-solid fa-location-dot mb-1 text-xl"></i>
                <span class="text-[11px] font-bold mt-1">الفروع</span>
            </a>
        </nav>

    </div>

    <!-- برمجة سلة الطلبات والواتساب -->
    <script>
        let cart = [];
        // حط رقم واتساب الفرع هنا (أكتوبر أو زايد) مع كود الدولة
        const whatsappNumber = "201000000000"; 

        function addToCart(itemName, itemPrice, button) {
            // إضافة المنتج للسلة
            cart.push({ name: itemName, price: itemPrice });
            
            // تحديث العداد الأحمر
            let cartCountBadge = document.getElementById('cart-count');
            cartCountBadge.innerText = cart.length;
            cartCountBadge.classList.remove('hidden');
            
            // تغيير شكل الزرار للأخضر مؤقتاً
            let originalText = button.innerHTML;
            button.classList.add('added-to-cart');
            button.innerHTML = '<i class="fa-solid fa-check"></i> <span>تم</span>';
            
            setTimeout(() => {
                button.classList.remove('added-to-cart');
                button.innerHTML = originalText;
            }, 1000);
        }

        function sendOrderWhatsApp() {
            if(cart.length === 0) {
                alert("السلة فارغة، اختار أكل الأول يا فندم!");
                return;
            }
            
            let message = "أهلاً مطعم أبو خالد، عايز أطلب الأوردر ده (من إعلان جوجل):\n\n";
            let total = 0;
            
            cart.forEach((item, index) => {
                message += `${index + 1}. ${item.name} - ${item.price} ج.م\n`;
                total += item.price;
            });
            
            message += `\nالإجمالي: ${total} ج.م\n`;
            message += "\nالتوصيل لعنوان: ";
            
            // تحويل الرسالة لرابط واتساب
            let encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${whatsappNumber}?text=${encodedMessage}`, '_blank');
        }
    </script>
</body>
</html>
