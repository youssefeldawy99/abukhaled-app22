<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أبو خالد للمشويات</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ak-black': '#121212',
              'ak-gold': '#d4af37',
              'ak-gray': '#1e1e1e',
            },
          },
        },
      };
    </script>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
      body {
        font-family: 'Tajawal', sans-serif;
        background-color: #000;
      }
      .hide-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .hide-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
    </style>
  </head>
  <body class="flex justify-center items-start min-h-screen">
    <!-- حاوية الموبايل -->
    <div
      class="w-full max-w-md bg-ak-black text-white min-h-screen relative shadow-2xl pb-24 border-x border-white/10"
    >
      <!-- الهيدر -->
      <header
        class="flex justify-between items-center p-4 bg-ak-black border-b border-ak-gold/20 sticky top-0 z-40"
      >
        <div class="text-xl font-bold text-ak-gold">
          <i class="fa-solid fa-fire-burner"></i> أبو خالد
        </div>
      </header>

      <!-- المحتوى -->
      <main class="p-4 text-center mt-10">
        <h1 class="text-ak-gold text-2xl mb-4">بداية شغل أبو خالد</h1>
        <p class="text-gray-400">
          التصميم متظبط بمقاس الموبايل، جاهزين للخطوة الجاية.
        </p>
      </main>
    </div>
  </body>
</html>
